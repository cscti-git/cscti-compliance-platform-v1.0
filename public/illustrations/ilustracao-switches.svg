<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <rect width="400" height="300" fill="#0B1B30"/>
  <rect x="20" y="20" width="360" height="260" rx="8" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="4 4" fill="#0F2442"/>
  <text x="200" y="45" text-anchor="middle" fill="#93C5FD" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">CSCTI COMPLIANCE — DIAGRAMA TÉCNICO</text>
  <text x="200" y="62" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="10">ILUSTRAÇÃO TÉCNICA — SWITCHES DE REDE GERENCIÁVEIS & UPLINKS FIBRA</text>
  
  <!-- Switch 24p Rackmount Chassis -->
  <rect x="60" y="90" width="280" height="40" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="75" y="105" fill="#38BDF8" font-family="monospace" font-size="8" font-weight="bold">SW-CORE-01 (L3 STACK)</text>
  <!-- RJ45 Ports (Dual Row) -->
  <g fill="#0F172A" stroke="#334155" stroke-width="0.8">
    <rect x="75" y="112" width="7" height="6"/>
    <rect x="85" y="112" width="7" height="6"/>
    <rect x="95" y="112" width="7" height="6"/>
    <rect x="105" y="112" width="7" height="6"/>
    <rect x="115" y="112" width="7" height="6"/>
    <rect x="125" y="112" width="7" height="6"/>
    <rect x="135" y="112" width="7" height="6"/>
    <rect x="145" y="112" width="7" height="6"/>
    <rect x="155" y="112" width="7" height="6"/>
    <rect x="165" y="112" width="7" height="6"/>
    <rect x="175" y="112" width="7" height="6"/>
    <rect x="185" y="112" width="7" height="6"/>
    
    <rect x="75" y="120" width="7" height="6"/>
    <rect x="85" y="120" width="7" height="6"/>
    <rect x="95" y="120" width="7" height="6"/>
    <rect x="105" y="120" width="7" height="6"/>
    <rect x="115" y="120" width="7" height="6"/>
    <rect x="125" y="120" width="7" height="6"/>
    <rect x="135" y="120" width="7" height="6"/>
    <rect x="145" y="120" width="7" height="6"/>
    <rect x="155" y="120" width="7" height="6"/>
    <rect x="165" y="120" width="7" height="6"/>
    <rect x="175" y="120" width="7" height="6"/>
    <rect x="185" y="120" width="7" height="6"/>
  </g>
  <!-- SFP+ Optical 10G Cages -->
  <rect x="205" y="112" width="12" height="14" rx="1" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <rect x="222" y="112" width="12" height="14" rx="1" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <rect x="239" y="112" width="12" height="14" rx="1" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <rect x="256" y="112" width="12" height="14" rx="1" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="237" y="105" text-anchor="middle" fill="#06B6D4" font-family="monospace" font-size="7">SFP+ 10GbE</text>

  <!-- LEDs Status -->
  <circle cx="280" cy="115" r="2.5" fill="#22C55E"/>
  <circle cx="290" cy="115" r="2.5" fill="#22C55E"/>
  <circle cx="300" cy="115" r="2.5" fill="#38BDF8"/>
  <circle cx="310" cy="115" r="2.5" fill="#22C55E"/>

  <!-- Optical Fiber Patch Cable (Teal curve) -->
  <path d="M 211 126 C 211 160, 160 160, 160 190" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" fill="none"/>
  <path d="M 228 126 C 228 165, 240 165, 240 190" stroke="#06B6D4" stroke-width="3" stroke-linecap="round" fill="none"/>

  <!-- DIO (Optical Distribution Box) -->
  <rect x="130" y="190" width="140" height="35" rx="4" fill="#0F172A" stroke="#06B6D4" stroke-width="1.5"/>
  <text x="200" y="206" text-anchor="middle" fill="#93C5FD" font-family="monospace" font-size="9" font-weight="bold">DIO ÓPTICO (DISTRIBUIÇÃO)</text>
  <text x="200" y="218" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="7">ATENDIMENTO • FRENTE • FUNDO</text>

  <text x="200" y="255" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold">TOPOLOGIA EM ESTRELA COM TRONCOS DE FIBRA ÓPTICA MONOMODO 10G</text>
  <text x="200" y="280" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="9">ISOLAMENTO GALVÂNICO COMPLETO CONTRA DESCARGAS ATMOSFÉRICAS</text>
</svg>
