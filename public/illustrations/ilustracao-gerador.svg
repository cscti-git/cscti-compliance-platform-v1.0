<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <rect width="400" height="300" fill="#0B1B30"/>
  <rect x="20" y="20" width="360" height="260" rx="8" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="4 4" fill="#0F2442"/>
  <text x="200" y="45" text-anchor="middle" fill="#93C5FD" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">CSCTI COMPLIANCE — DIAGRAMA TÉCNICO</text>
  <text x="200" y="62" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="10">ILUSTRAÇÃO TÉCNICA — GRUPO MOTOGERADOR DE EMERGÊNCIA & QTA</text>
  
  <!-- Enclosure Body -->
  <rect x="70" y="85" width="180" height="135" rx="8" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  
  <!-- Louvers / Ventilation Grille -->
  <line x1="85" y1="105" x2="135" y2="105" stroke="#475569" stroke-width="3"/>
  <line x1="85" y1="115" x2="135" y2="115" stroke="#475569" stroke-width="3"/>
  <line x1="85" y1="125" x2="135" y2="125" stroke="#475569" stroke-width="3"/>
  <line x1="85" y1="135" x2="135" y2="135" stroke="#475569" stroke-width="3"/>
  
  <!-- Access Doors -->
  <rect x="145" y="98" width="95" height="105" rx="4" fill="#0F172A" stroke="#334155" stroke-width="1.5"/>
  <circle cx="155" cy="150" r="3" fill="#64748B"/>
  
  <!-- Exhaust Pipe -->
  <path d="M 100 85 L 100 70 L 115 70" stroke="#94A3B8" stroke-width="4" stroke-linecap="round" fill="none"/>
  
  <!-- Fuel Tank Base -->
  <rect x="65" y="215" width="190" height="20" rx="4" fill="#0F172A" stroke="#E2E8F0" stroke-width="1.5"/>
  <text x="160" y="229" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">DIESEL BASE TANK</text>

  <!-- QTA Panel (Automatic Transfer Switch) -->
  <rect x="270" y="95" width="70" height="110" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <rect x="280" y="105" width="50" height="22" rx="2" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="305" y="119" text-anchor="middle" fill="#22C55E" font-family="monospace" font-size="8" font-weight="bold">QTA OK</text>
  
  <!-- LEDs on QTA -->
  <circle cx="288" cy="140" r="3" fill="#22C55E"/>
  <text x="296" y="143" fill="#94A3B8" font-family="monospace" font-size="7">REDE</text>
  <circle cx="288" cy="155" r="3" fill="#F59E0B"/>
  <text x="296" y="158" fill="#94A3B8" font-family="monospace" font-size="7">GERADOR</text>
  <circle cx="288" cy="170" r="3" fill="#38BDF8"/>
  <text x="296" y="173" fill="#94A3B8" font-family="monospace" font-size="7">CARGA</text>

  <!-- Transfer Cable -->
  <path d="M 250 150 L 270 150" stroke="#38BDF8" stroke-width="3" stroke-dasharray="2 2"/>

  <!-- Warning Symbol -->
  <polygon points="195,120 205,140 185,140" fill="#F59E0B"/>
  <text x="195" y="137" text-anchor="middle" fill="#000" font-family="sans-serif" font-size="9" font-weight="bold">!</text>

  <text x="200" y="260" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold">ACIONAMENTO AUTOMÁTICO POR QUADRO DE TRANSFERÊNCIA (QTA)</text>
  <text x="200" y="285" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="9">AUTONOMIA CONTÍNUA • CABINE SILENCIADA • ART VÁLIDA</text>
</svg>
