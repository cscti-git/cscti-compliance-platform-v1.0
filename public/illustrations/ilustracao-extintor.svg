<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <rect width="400" height="300" fill="#0B1B30"/>
  <rect x="20" y="20" width="360" height="260" rx="8" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="4 4" fill="#0F2442"/>
  <text x="200" y="45" text-anchor="middle" fill="#93C5FD" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">CSCTI COMPLIANCE — DIAGRAMA TÉCNICO</text>
  <text x="200" y="62" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="10">ILUSTRAÇÃO TÉCNICA — COMBATE A INCÊNDIO / EXTINTOR CO2 LIMPO</text>
  
  <!-- Extinguisher Cylinder Body -->
  <rect x="165" y="115" width="70" height="110" rx="15" fill="#EF4444" stroke="#B91C1C" stroke-width="2"/>
  
  <!-- Discharge Horn / Hose -->
  <path d="M 175 110 L 140 125 L 130 160" stroke="#1E293B" stroke-width="6" stroke-linecap="round" fill="none"/>
  <polygon points="120,165 140,155 125,180" fill="#0F172A"/>

  <!-- Valve & Lever -->
  <rect x="190" y="95" width="20" height="20" rx="2" fill="#94A3B8" stroke="#475569" stroke-width="1.5"/>
  <path d="M 185 95 L 215 90" stroke="#0F172A" stroke-width="4" stroke-linecap="round"/>
  <path d="M 185 85 L 215 85" stroke="#94A3B8" stroke-width="3" stroke-linecap="round"/>
  <!-- Safety Pin -->
  <circle cx="218" cy="85" r="4" fill="#F59E0B" stroke="#000" stroke-width="1"/>

  <!-- Pressure Gauge (Manometer) -->
  <circle cx="200" cy="105" r="6" fill="#F8FAFC" stroke="#0F172A" stroke-width="1.5"/>
  <line x1="200" y1="105" x2="202" y2="101" stroke="#22C55E" stroke-width="1.5"/>

  <!-- Label / Inspection Tag -->
  <rect x="175" y="145" width="50" height="45" rx="3" fill="#F8FAFC" stroke="#CBD5E1" stroke-width="1"/>
  <text x="200" y="160" text-anchor="middle" fill="#0F172A" font-family="sans-serif" font-size="9" font-weight="bold">CO2 LIMPO</text>
  <text x="200" y="172" text-anchor="middle" fill="#047857" font-family="sans-serif" font-size="8" font-weight="bold">CLASSE BC</text>
  <text x="200" y="183" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="7">INSPEÇÃO OK</text>

  <!-- Mount Bracket / Floor Stand -->
  <rect x="155" y="225" width="90" height="12" rx="3" fill="#1E293B" stroke="#475569" stroke-width="1"/>

  <text x="200" y="260" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold">GÁS LIMPO INDICADO PARA SALA DE TI (NÃO DEIXA RESÍDUOS NOS CIRCUITOS)</text>
  <text x="200" y="285" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="9">MANUTENÇÃO ANUAL OBRIGATÓRIA COM LACRE E MANÔMETRO AFERIDO</text>
</svg>
