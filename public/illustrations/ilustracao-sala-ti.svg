<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <rect width="400" height="300" fill="#0B1B30"/>
  <rect x="20" y="20" width="360" height="260" rx="8" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="4 4" fill="#0F2442"/>
  <text x="200" y="45" text-anchor="middle" fill="#93C5FD" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">CSCTI COMPLIANCE — DIAGRAMA TÉCNICO</text>
  <text x="200" y="62" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="10">ILUSTRAÇÃO TÉCNICA — SALA DE TI / CPD (CONTROLE DE ACESSO BIOMÉTRICO)</text>
  
  <!-- Room Security Door -->
  <rect x="90" y="85" width="100" height="150" rx="4" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <!-- Door Window Reinforced -->
  <rect x="115" y="100" width="50" height="40" rx="2" fill="#0F2442" stroke="#64748B" stroke-width="1.5"/>
  <line x1="125" y1="100" x2="125" y2="140" stroke="#475569" stroke-width="1"/>
  <line x1="140" y1="100" x2="140" y2="140" stroke="#475569" stroke-width="1"/>
  <line x1="155" y1="100" x2="155" y2="140" stroke="#475569" stroke-width="1"/>
  
  <!-- Biometric Access Controller on Wall -->
  <rect x="210" y="125" width="45" height="70" rx="4" fill="#0F172A" stroke="#22C55E" stroke-width="1.5"/>
  <!-- Fingerprint Sensor Pad -->
  <rect x="220" y="135" width="25" height="28" rx="3" fill="#1E293B" stroke="#22C55E" stroke-width="1"/>
  <path d="M 226 148 C 226 142, 239 142, 239 148 C 239 154, 233 158, 233 158" stroke="#22C55E" stroke-width="1.5" fill="none"/>
  <circle cx="232" cy="172" r="3" fill="#22C55E"/>
  <text x="232" y="185" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="7">BIO IP</text>

  <!-- Electromagnetic Lock at top of door -->
  <rect x="125" y="87" width="30" height="8" rx="1" fill="#E2E8F0" stroke="#64748B" stroke-width="1"/>
  <path d="M 190 91 L 210 130" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2"/>

  <!-- Security Camera (CCTV Dome) -->
  <path d="M 270 95 C 270 85, 300 85, 300 95 Z" fill="#E2E8F0"/>
  <ellipse cx="285" cy="98" rx="12" ry="8" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <circle cx="285" cy="98" r="3" fill="#EF4444"/>

  <!-- Warning Sign -->
  <rect x="270" y="130" width="75" height="50" rx="3" fill="#FEF3C7" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="307" y="148" text-anchor="middle" fill="#78350F" font-family="sans-serif" font-size="9" font-weight="bold">ACESSO</text>
  <text x="307" y="160" text-anchor="middle" fill="#78350F" font-family="sans-serif" font-size="8" font-weight="bold">RESTRITO</text>
  <text x="307" y="172" text-anchor="middle" fill="#92400E" font-family="sans-serif" font-size="7">SOMENTE AUTORIZADOS</text>

  <text x="200" y="255" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold">SALA DE TI COM CONTROLE DE ACESSO FÍSICO, CFTV E TRANCAMENTO ELETROMAGNÉTICO</text>
  <text x="200" y="280" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="9">REGISTRO DE ENTRADAS/SAÍDAS COM DATA/HORA E VÍDEO MONITORADO 24X7</text>
</svg>
