<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <rect width="400" height="300" fill="#0B1B30"/>
  <rect x="20" y="20" width="360" height="260" rx="8" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="4 4" fill="#0F2442"/>
  <text x="200" y="45" text-anchor="middle" fill="#93C5FD" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">CSCTI COMPLIANCE — DIAGRAMA TÉCNICO</text>
  <text x="200" y="62" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="10">ILUSTRAÇÃO TÉCNICA — NOBREAK SENOIDAL ONLINE / BANCO DE BATERIAS</text>
  
  <!-- Nobreak Unit Main Body -->
  <rect x="80" y="85" width="110" height="155" rx="6" fill="#1E293B" stroke="#F59E0B" stroke-width="2"/>
  <rect x="92" y="98" width="86" height="36" rx="4" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <!-- Display LCD Screen -->
  <text x="135" y="112" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="9" font-weight="bold">ONLINE 220V</text>
  <text x="135" y="124" text-anchor="middle" fill="#22C55E" font-family="monospace" font-size="8">AUTONOMIA: 90m</text>
  <!-- Buttons & LEDs -->
  <circle cx="102" cy="148" r="3" fill="#22C55E"/>
  <circle cx="114" cy="148" r="3" fill="#38BDF8"/>
  <circle cx="126" cy="148" r="3" fill="#F59E0B"/>
  <line x1="95" y1="165" x2="175" y2="165" stroke="#334155" stroke-width="2"/>
  <line x1="95" y1="175" x2="175" y2="175" stroke="#334155" stroke-width="2"/>
  <line x1="95" y1="185" x2="175" y2="185" stroke="#334155" stroke-width="2"/>
  <line x1="95" y1="195" x2="175" y2="195" stroke="#334155" stroke-width="2"/>
  <line x1="95" y1="205" x2="175" y2="205" stroke="#334155" stroke-width="2"/>
  <text x="135" y="228" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9">UPS DUPLA CONV.</text>

  <!-- External Battery Cabinet -->
  <rect x="210" y="85" width="110" height="155" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <text x="265" y="105" text-anchor="middle" fill="#94A3B8" font-family="monospace" font-size="9" font-weight="bold">BANCO BATERIAS</text>
  
  <!-- Battery Shelves -->
  <rect x="220" y="115" width="90" height="24" rx="2" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <circle cx="235" cy="127" r="4" fill="#38BDF8"/>
  <circle cx="255" cy="127" r="4" fill="#38BDF8"/>
  <circle cx="275" cy="127" r="4" fill="#38BDF8"/>
  <circle cx="295" cy="127" r="4" fill="#38BDF8"/>
  
  <rect x="220" y="145" width="90" height="24" rx="2" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <circle cx="235" cy="157" r="4" fill="#38BDF8"/>
  <circle cx="255" cy="157" r="4" fill="#38BDF8"/>
  <circle cx="275" cy="157" r="4" fill="#38BDF8"/>
  <circle cx="295" cy="157" r="4" fill="#38BDF8"/>

  <rect x="220" y="175" width="90" height="24" rx="2" fill="#0F172A" stroke="#475569" stroke-width="1"/>
  <circle cx="235" cy="187" r="4" fill="#38BDF8"/>
  <circle cx="255" cy="187" r="4" fill="#38BDF8"/>
  <circle cx="275" cy="187" r="4" fill="#38BDF8"/>
  <circle cx="295" cy="187" r="4" fill="#38BDF8"/>
  
  <!-- DC Interconnect Cable -->
  <path d="M 190 180 Q 200 170 210 180" stroke="#F59E0B" stroke-width="3" fill="none"/>
  <path d="M 190 186 Q 200 176 210 186" stroke="#EF4444" stroke-width="3" fill="none"/>

  <text x="200" y="285" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="9">ALIMENTAÇÃO ININTERRUPTA COM GESTÃO SNMP INTEGRADA</text>
