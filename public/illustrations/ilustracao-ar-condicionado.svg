<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300" fill="none">
  <rect width="400" height="300" fill="#0B1B30"/>
  <rect x="20" y="20" width="360" height="260" rx="8" stroke="#1E3A8A" stroke-width="2" stroke-dasharray="4 4" fill="#0F2442"/>
  <text x="200" y="45" text-anchor="middle" fill="#93C5FD" font-family="monospace" font-size="12" font-weight="bold" letter-spacing="2">CSCTI COMPLIANCE — DIAGRAMA TÉCNICO</text>
  <text x="200" y="62" text-anchor="middle" fill="#64748B" font-family="sans-serif" font-size="10">ILUSTRAÇÃO TÉCNICA — AR-CONDICIONADO / SPLIT DE PRECISÃO (REVEZAMENTO)</text>
  
  <!-- Evaporator Unit (Indoor) -->
  <rect x="80" y="85" width="240" height="75" rx="6" fill="#1E293B" stroke="#38BDF8" stroke-width="2"/>
  <line x1="90" y1="135" x2="310" y2="135" stroke="#475569" stroke-width="2"/>
  <!-- Louver Flap -->
  <path d="M 95 142 L 305 142" stroke="#38BDF8" stroke-width="3" stroke-linecap="round"/>
  <!-- Air Flow Waves -->
  <path d="M 120 152 Q 130 168 140 152 Q 150 168 160 152" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  <path d="M 180 152 Q 190 168 200 152 Q 210 168 220 152" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>
  <path d="M 240 152 Q 250 168 260 152 Q 270 168 280 152" stroke="#38BDF8" stroke-width="1.5" stroke-dasharray="2 2" fill="none"/>

  <!-- Temperature Digital Display -->
  <rect x="245" y="98" width="55" height="24" rx="3" fill="#0F172A" stroke="#38BDF8" stroke-width="1"/>
  <text x="272" y="115" text-anchor="middle" fill="#38BDF8" font-family="monospace" font-size="12" font-weight="bold">20.5°C</text>
  
  <!-- Dual Unit Selector / Controller -->
  <rect x="140" y="185" width="120" height="55" rx="4" fill="#0F172A" stroke="#22C55E" stroke-width="1.5"/>
  <text x="200" y="202" text-anchor="middle" fill="#93C5FD" font-family="monospace" font-size="9" font-weight="bold">MÓDULO REVEZAMENTO</text>
  <circle cx="165" cy="222" r="5" fill="#22C55E"/>
  <text x="175" y="225" fill="#E2E8F0" font-family="sans-serif" font-size="8">SPLIT 01 (ATIVO)</text>
  <circle cx="230" cy="222" r="5" fill="#64748B"/>
  <text x="240" y="225" fill="#94A3B8" font-family="sans-serif" font-size="8">02 (STBY)</text>

  <text x="200" y="260" text-anchor="middle" fill="#E2E8F0" font-family="sans-serif" font-size="11" font-weight="bold">CLIMATIZAÇÃO DEDICADA 24X7 COM CICLO AUTOMÁTICO DE 12 HORAS</text>
  <text x="200" y="285" text-anchor="middle" fill="#64748B" font-family="monospace" font-size="9">FAIXA TÉRMICA PADRÃO REGISTRAL: 19°C A 22°C COM SENSOR SNMP</text>
</svg>
